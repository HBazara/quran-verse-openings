<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2f6b46" />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <!-- Opens every time the site opens: each choice is written in its own language. -->
    <div
      id="language-screen"
      class="language"
      role="dialog"
      aria-modal="true"
      aria-labelledby="language-title"
    >
      <div class="language-box">
        <h1 id="language-title" class="language-title">
          <span lang="ar" dir="rtl" data-i18n-ar="app.title"></span>
          <span lang="en" dir="ltr" data-i18n-en="app.title"></span>
        </h1>
        <p class="language-prompt">
          <span lang="en" dir="ltr" data-i18n-en="lang.choose"></span>
          <span lang="ar" dir="rtl" data-i18n-ar="lang.choose"></span>
        </p>
        <div class="language-choices">
          <button
            type="button"
            data-lang="en"
            lang="en"
            dir="ltr"
            data-i18n-en="lang.name"
          ></button>
          <button
            type="button"
            data-lang="ar"
            lang="ar"
            dir="rtl"
            data-i18n-ar="lang.name"
          ></button>
        </div>
      </div>
    </div>
    <div class="top">
      <header class="bar">
        <!-- Physical order on purpose: Next is on the left, as in an Arabic book. -->
        <div class="nav" dir="ltr">
          <button id="next" class="icon" type="button" data-i18n-label="nav.next" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M15 5l-7 7 7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <span id="indicator" class="indicator" aria-live="polite"></span>
          <button id="prev" class="icon" type="button" data-i18n-label="nav.prev" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M9 5l7 7-7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="tools">
          <button
            id="goto-toggle"
            class="icon"
            type="button"
            aria-expanded="false"
            aria-controls="goto-panel"
            data-i18n-label="goto.title"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M9 6h11M9 12h11M9 18h11"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="4.5" cy="6" r="1.5" fill="currentColor" />
              <circle cx="4.5" cy="12" r="1.5" fill="currentColor" />
              <circle cx="4.5" cy="18" r="1.5" fill="currentColor" />
            </svg>
          </button>
          <button
            id="settings-toggle"
            class="icon"
            type="button"
            aria-expanded="false"
            aria-controls="settings-panel"
            data-i18n-label="settings.title"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h8M18 7h2M4 17h2M12 17h8"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
              <circle cx="15" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="2.2" />
              <circle cx="9" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="2.2" />
            </svg>
          </button>
          <!-- Shows the other language's name in that language; switches without reloading. -->
          <button id="lang-switch" class="pill" type="button"></button>
          <div class="views" role="group" data-i18n-label="view.label">
            <button id="view-single" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect
                  x="6"
                  y="3"
                  width="12"
                  height="18"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <span class="label" data-i18n="view.single"></span>
            </button>
            <button id="view-spread" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect
                  x="2"
                  y="4"
                  width="9"
                  height="16"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <rect
                  x="13"
                  y="4"
                  width="9"
                  height="16"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <span class="label" data-i18n="view.spread"></span>
            </button>
          </div>
        </div>
      </header>

      <section id="goto-panel" class="panel" data-i18n-label="goto.title" hidden>
        <form id="page-form" class="field" novalidate>
          <label for="page-input" data-i18n="goto.page"></label>
          <div class="row">
            <input
              id="page-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="go"
              aria-describedby="page-error"
            />
            <button class="go" type="submit" data-i18n="goto.go"></button>
          </div>
          <p id="page-error" class="error" aria-live="polite"></p>
        </form>
        <div class="field">
          <label for="surah-search" data-i18n="search.label"></label>
          <input
            id="surah-search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="go"
            aria-describedby="search-status"
            data-i18n-placeholder="search.placeholder"
          />
          <p id="search-status" class="muted" aria-live="polite"></p>
          <ul id="search-results" class="results"></ul>
        </div>
        <div class="field">
          <label for="surah-select" data-i18n="goto.surah"></label>
          <select id="surah-select"></select>
        </div>
        <div class="field">
          <label for="juz-select" data-i18n="goto.juz"></label>
          <select id="juz-select"></select>
        </div>
        <section class="field" aria-labelledby="marks-title">
          <h2 id="marks-title" class="panel-title" data-i18n="marks.title"></h2>
          <div id="marks-list" class="marks"></div>
        </section>
        <section class="field" aria-labelledby="bookmarks-title">
          <h2 id="bookmarks-title" class="panel-title" data-i18n="bookmarks.title"></h2>
          <div id="bookmarks-list"></div>
        </section>
        <section class="field" aria-labelledby="progress-title">
          <h2 id="progress-title" class="panel-title" data-i18n="progress.title"></h2>
          <p id="progress-summary" class="muted"></p>
          <p class="muted" data-i18n="progress.hint"></p>
          <!-- A picture of all pages; the page box above does the same job for the keyboard. -->
          <div id="progress-grid" class="grid" aria-hidden="true"></div>
        </section>
      </section>

      <section id="settings-panel" class="panel" data-i18n-label="settings.title" hidden>
        <fieldset class="field">
          <legend data-i18n="settings.words"></legend>
          <div id="words-choices" class="choices"></div>
        </fieldset>
        <div class="check">
          <input id="markers-toggle" type="checkbox" />
          <label for="markers-toggle" data-i18n="settings.markers"></label>
        </div>
        <div class="check">
          <input id="margin-toggle" type="checkbox" />
          <label for="margin-toggle" data-i18n="settings.margin"></label>
        </div>
        <div class="check">
          <input id="peek-toggle" type="checkbox" />
          <label for="peek-toggle" data-i18n="settings.peek"></label>
        </div>
        <div class="check">
          <input id="test-toggle" type="checkbox" />
          <label for="test-toggle" data-i18n="settings.test"></label>
        </div>
        <div class="field">
          <label for="zoom-select" data-i18n="settings.zoom"></label>
          <select id="zoom-select"></select>
        </div>
        <fieldset class="field">
          <legend data-i18n="settings.theme"></legend>
          <div id="theme-choices" class="choices">
            <label class="choice">
              <input type="radio" name="theme" value="light" />
              <span data-i18n="theme.light"></span>
            </label>
            <label class="choice">
              <input type="radio" name="theme" value="dark" />
              <span data-i18n="theme.dark"></span>
            </label>
            <label class="choice">
              <input type="radio" name="theme" value="sepia" />
              <span data-i18n="theme.sepia"></span>
            </label>
          </div>
        </fieldset>
        <section id="offline" class="field" aria-labelledby="offline-title">
          <h2 id="offline-title" class="panel-title" data-i18n="offline.title"></h2>
          <p class="muted" data-i18n="offline.hint"></p>
          <p id="offline-status" aria-live="polite"></p>
          <button
            id="offline-download"
            class="go"
            type="button"
            data-i18n="offline.download"
          ></button>
        </section>
        <form id="print-form" class="field" novalidate>
          <h2 class="panel-title" data-i18n="print.title"></h2>
          <div class="row">
            <label class="stack">
              <span data-i18n="print.from"></span>
              <input
                id="print-from"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                aria-describedby="print-error"
              />
            </label>
            <label class="stack">
              <span data-i18n="print.to"></span>
              <input
                id="print-to"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                aria-describedby="print-error"
              />
            </label>
          </div>
          <p class="muted" data-i18n="print.hint"></p>
          <button class="go" type="submit" data-i18n="print.go"></button>
          <p id="print-error" class="error" aria-live="polite"></p>
        </form>
      </section>
    </div>
    <p id="status" class="status" role="status"></p>
    <main id="book" class="book"></main>
    <!-- Test mode: shows the hidden openings one at a time. -->
    <div id="test-bar" class="test-bar" role="region" data-i18n-label="test.label" hidden>
      <button id="test-next" class="go" type="button" data-i18n="test.next"></button>
      <span id="test-count" class="test-count" aria-live="polite"></span>
      <button id="test-all" class="pill" type="button" data-i18n="test.all"></button>
      <button id="test-hide" class="pill" type="button" data-i18n="test.hide"></button>
      <button id="test-end" class="pill" type="button" data-i18n="test.end"></button>
    </div>
    <!-- Pages for printing; shown only on paper. -->
    <div id="print-area" class="print-area"></div>
  </body>
</html>
